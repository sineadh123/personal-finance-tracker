<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="index.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
    <title>Personal Finance Tracker</title>
</head>
<body>
        <div class="sidenav">
        <a href="index.html">Dashboard</a>
        <a href="analytics.html">Analytics</a>
        <a href="transactions.html">Transactions</a>
        </div>

                <!-- Add all page content inside this div if you want the side nav to push page content to the right (not used if you only want the sidenav to sit on top of the page -->
        <div class="main">
                        <button type="button" class="collapsible">Add a Transaction</button>
                        <div class="content">
                                <!--Add a new transaction form below-->
                                <form>
                                <p>Select transaction type:</p>
                                <input type="radio" id="income" name="typeOfTransaction" value="Income">
                                <label for="income">Income</label><br>
                                <input type="radio" id="expense" name="typeOfTransaction" value="Expense">
                                <label for="expense">Expense</label><br><br>

                                <label for="amount">Amount</label><br>
                                <input type="text" id="amount" name="amount"><br>

                                <!--Category restricted autofill-->
                                <label for="category">Category</label><br>
                                <input style="display:none;" type="text" id="income-cat" name="category" list="income-categories"><br>
                                <datalist id="income-categories">
                                        <option>Salary</option>
                                        <option>Freelance</option>
                                        <option>Gift</option>
                                        <option>Investment</option>
                                        <option>Other</option>
                                </datalist>
                                <input style="display:none;" type="text" id="expense-cat" name="category" list="expense-categories"><br>
                                <datalist id="expense-categories">
                                        <option>Food</option>
                                        <option>Transport</option>
                                        <option>Shopping</option>
                                        <option>Bills</option>
                                        <option>Entertainment</option>
                                        <option>Health</option>
                                        <option>Education</option>
                                        <option>Other</option>
                                </datalist>

                                <label for="description">Description</label><br>
                                <input type="text" id="description" name="description"><br>
                                <label for="date">Date</label><br>
                                <input type="text" id="date" name="date"><br><br>

                                <button id="addTransaction" type="button">Submit</button>
                                </form>
                        </div>
        

                <!--display ALL transactions-->
                <h3>All Transactions</h3>
                <table>
                <tr>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Date</th>
                </tr>
                <tr>
                        <td>Income</td>
                        <td>£2000</td>
                        <td>Salary</td>
                        <td>Monthly Wage</td>
                        <td>01/09</td>
                </tr>
                <tr>
                        <td>Expense</td>
                        <td>£20</td>
                        <td>Food</td>
                        <td>Lunch</td>
                        <td>02/09</td>
                </tr>
                </table>
        </div>

        <script src = "index.js"></script>
</body>
</html>
